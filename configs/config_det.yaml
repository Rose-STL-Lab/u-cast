# ==============================================================================
# U-Cast STAGE 1: deterministic pre-training on ERA5 1.5° (weighted MAE).
#
# This is the base config. configs/config_prob.yaml inherits from it and only
# overrides what changes for Stage 2 (probabilistic CRPS fine-tuning).
#
# Run with:
#   python run.py --config-name config_det datamodule.data_dir=/path/to/data
# Values set to `???` are mandatory and MUST be provided on the command line or overriden here.
# ==============================================================================

# ── Paths (set these for your environment) ────────────────────────────────────
work_dir: ./results
ckpt_dir: ${work_dir}/checkpoints/
log_dir: ${work_dir}/logs/

# ── Run settings ──────────────────────────────────────────────────────────────
seed: 11
print_config: true
ignore_warnings: true
eval_mode: null    # "validate" to run validation from a checkpoint (no training); leave null to train
ckpt_path: null    # path to a checkpoint to resume training, or required when eval_mode=validate

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: 1                          # override with e.g. [0,1,2,3] for multi-GPU
  strategy: ddp_find_unused_parameters_false
  num_nodes: 1
  max_epochs: 100                     # Stage 1: long, cheap deterministic pre-training
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1          # auto-derived from batch_size / batch_size_per_gpu / #GPUs
  precision: 16
  num_sanity_val_steps: 0
  deterministic: false
  benchmark: false

# ── Model architecture (DhariwalUNet / ADM) ───────────────────────────────────
model:
  _target_: src.models.networks_edm.DhariwalUNet
  model_channels: 320
  channel_mult: [1, 2, 3, 4]
  num_blocks: 4
  dropout: 0.1                        # MC-Dropout rate (acts as a regularizer in Stage 1)
  loss_function: wmae                 # Stage 1: spatially-weighted MAE (= CRPS for a single member)
  num_training_ensemble_members: 1
  attn_levels: [2, 3]

# ── Data module ───────────────────────────────────────────────────────────────
datamodule:
  _target_: src.datamodules.era5.ERA5DataModule
  data_dir: ???                       # REQUIRED: directory containing the .zarr dataset
  dataset: 1959-2023_01_10-6h-240x121_equiangular_with_poles_conservative.zarr
  data_dir_stats: "data/stats/"               # if null, stats are looked up next to data_dir
  batch_size: 48                      # EFFECTIVE (global) batch size
  batch_size_per_gpu: 8              # per-GPU micro-batch; gradient accumulation makes up the rest
  eval_batch_size: 12
  num_workers: 8
  pin_memory: true
  prefetch_factor: 3
  persistent_workers: true
  window: 2
  horizon: 1
  hourly_resolution: 12
  train_slice:
    - ["1979-01-01T00:00:00", "2019-12-31T23:00:00"]
    - ["1979-01-01T06:00:00", "2019-12-31T23:00:00"]
  val_slice: ["2020-01-01", "2020-12-31 23:59:59"]
  max_val_samples: 36
  prediction_horizon: 4
  possible_initial_times_eval: [0, 12]
  static_fields:
    - land_sea_mask
    - geopotential_at_surface
  forcing_fields:
    - year_progress_sin
