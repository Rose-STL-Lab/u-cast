# ── Lightning module (training / optimizer / scheduler) ───────────────────────
module:
  _target_: src.experiment.UCastExperiment
  optimizer:
    name: adamw                       # AdamW handles 1D params; Muon handles the 2D weight matrices
    lr: 3.0e-04
    weight_decay: 0.1
    eps: 1.0e-08
    betas: [0.9, 0.95]
    muon:
      momentum: 0.95
      lr: 0.003
      wd: 0.03
  scheduler:
    _target_: src.optimization.lr_scheduler.LinearWarmupCosineAnnealingLR
    warmup_steps: 1500
    max_epochs: ${trainer.max_epochs}
    warmup_start_lr: 1.0e-08
    eta_min: 1.0e-08
    last_epoch: -1
  monitor: val/avg/rmse               # deterministic metric (no ensemble in Stage 1)
  mode: min
  ema_decay: 0.9999
  conv_padding_mode_global: circular_height_only
  num_predictions: 1                  # deterministic validation: single forecast
  num_predictions_in_memory: 1
  verbose: true

# ── Callbacks ─────────────────────────────────────────────────────────────────
callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val/avg/rmse
    mode: min
    save_top_k: 1
    save_last: true
    verbose: true
    dirpath: ${ckpt_dir}
    filename: ucast_era5_epoch{epoch:03d}
    auto_insert_metric_name: false
  early_stopping: null
  learning_rate_logging:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor

# ── Logger (W&B: set entity/project for your account, or remove to disable) ──
logger:
  wandb:
    _target_: src.utilities.wandb_utils.MyWandbLogger
    entity: null          # set to your W&B entity/username
    project: u-cast
    name: null            # auto-generated if null
    mode: online          # "online" | "offline" | "disabled"
    save_dir: ${work_dir}
    log_model: false
    resume: allow
    id: null              # set to resume a specific W&B run
