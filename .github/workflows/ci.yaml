name: Run code quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  check_code_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Check quality
        run: |
          ruff check src --fix